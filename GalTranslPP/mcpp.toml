[package]
namespace = "gpp"
name = "core"
description = "GalTransl++ core library"

[profile.release]
opt = 3
debug = true
lto = true
strip = false
ldflags = ["-Wl,/DEBUG", "-Wl,/OPT:REF", "-Wl,/OPT:ICF", "-Wl,/INCREMENTAL:NO"]

[profile.fast-release]
opt = 0
debug = true
lto = false
strip = false
ldflags = ["-Wl,/DEBUG"]

[build]
default-profile = "release"
sources = [
  "**/*.cpp",
  "**/*.ixx",
  "../3rdParty/3rdModule/AbslContainers.ixx",
  "../3rdParty/3rdModule/boost.ixx",
  "../3rdParty/3rdModule/ctpl_stl.ixx",
  "../3rdParty/3rdModule/jpcre2/jpcre2.ixx",
  "../3rdParty/3rdModule/json.ixx",
  "../3rdParty/3rdModule/spdlog.ixx",
  "../3rdParty/3rdModule/utf8cpp.ixx"
]
module_extensions = [".ixx"]
include_dirs = [
  ".",
  "../3rdParty/3rdModule",
  "../3rdParty/pybind11/include",
  "../3rdParty/pybind11/Python/include"
]
ldflags = [
  "-L../3rdParty/pybind11/bin",
  "-lpython312",
  "-lpython3",
  "-luser32",
  "-loleaut32"
]

# bit7z loads 7-Zip's library at run time; the official 7z.dll is part of the
# xim:7zip payload on Windows, and the build program deploys it.
[target.windows.xlings.workspace]
# The Qt SDK, at the version this project builds with (rules-qt declares none).
"xim:qt-base" = "6.11.1.1"
"xim:7zip" = ">=26.02"

[build-dependencies]
"gpp.build" = { path = "../mcpp-build-scripts", host-module = true }

[build-dependencies.mcpp]
plugins = { version = "0.15.1", features = ["deps-vcpkg", "deps-archive", "rules-qt"], host-module = true }

[targets.GalTranslPP]
kind = "lib"
