[workspace]
members = ["GalTranslPP", "GPPVersion", "GPPCLI", "GPPGUI", "Updater"]

[workspace.package]
version = "3.1.1"
standard = "c++23"
license = "Apache-2.0"

[toolchain]
windows = "llvm@22.1.8"

# mcpp:plugins, at one version for every member; each member states its own
# features (`mcpp.plugins = { workspace = true, features = [...] }`).
# mcpp-build-scripts is not a member and names the same version itself.
[workspace.dependencies]
mcpp.plugins = "0.16.0"

# The Windows payloads every member builds with, declared once: members inherit
# the root's [xlings.workspace] entries and conditional rows (mcpp 2026.9.27.1).
#   xim:qt-base  the Qt SDK; rules-qt declares none. To build with another Qt,
#                comment the line out and set QT_ROOT_DIR, or gpp::qt_root.
#   xim:7zip     7z.dll, which bit7z loads at run time.
[target.windows.xlings.workspace]
"xim:qt-base" = "6.11.1"
"xim:7zip" = ">=26.02"

[workspace.build]
cxxflags = [
  "-finput-charset=UTF-8",
  "-fexec-charset=UTF-8"
]
defines = [
  "NOMINMAX",
  "_CRT_SECURE_NO_WARNINGS",
  "SPDLOG_COMPILED_LIB",
  "SPDLOG_WCHAR_FILENAMES",
  "PROJECT_NO_ANSI",
  "_RANGES_", # import std; 时如果有头文件 #include <ranges> 会导致调用 std::views::zip 时出现异常定义不一致的问题。这是 MSVC STL 的问题，不知道后续能不能修复
]
dialect_cxxflags = ["-fms-runtime-lib=dll"]
