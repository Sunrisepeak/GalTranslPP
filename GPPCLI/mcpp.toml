[package]
namespace = "gpp"
name = "cli"

[dependencies]
"gpp.core" = { path = "../GalTranslPP" }
"gpp.version" = { path = "../GPPVersion" }

[build-dependencies]
"gpp.build" = { path = "../mcpp-build-scripts", host-module = true }
mcpp.plugins = { workspace = true, features = ["deps-vcpkg", "rules-qt"], host-module = true }
"gpp.runtime-stage" = { path = "../mcpp-build-scripts/runtime-stage", tools = ["runtime_stage"] }

[target.windows.xlings.workspace]
# The Qt SDK this project builds with; rules-qt declares none. Every member
# that uses Qt declares it, since a member's build program sees only the
# payloads that member declares (mcpp#713). To build with another Qt, comment
# the line out and set QT_ROOT_DIR, or set `qt.root` in build.mcpp.
"xim:qt-base" = "6.11.1"
# 7z.dll, which bit7z loads at run time: the official library, part of the
# xim:7zip payload on Windows. The runtime stage reads it from this member's
# own declaration.
"xim:7zip" = ">=26.02"

[profile.release]
opt = 3
debug = true
lto = true
strip = false
ldflags = ["-Wl,/DEBUG", "-Wl,/OPT:REF", "-Wl,/OPT:ICF", "-Wl,/INCREMENTAL:NO"]

[profile.fast-release]
opt = 0
debug = true
lto = false
strip = false
ldflags = ["-Wl,/DEBUG"]

[build]
default-profile = "release"
sources = ["ProgressBar.ixx", "TerminalController.ixx"]
module_extensions = [".ixx"]
include_dirs = [
  ".",
  "../GalTranslPP",
  "../3rdParty/pybind11/include",
  "../3rdParty/pybind11/Python/include"
]
ldflags = ["-L../3rdParty/pybind11/bin", "-lpython312", "-lpython3"]

[targets.GalTranslPP_CLI]
kind = "bin"
main = "GPPCLI.cpp"
windows_subsystem = "console"

[resources]
files = ["GPPCLI.rc"]
extra-inputs = ["GPPCLI.manifest"]
