[package]
namespace = "gpp"
name = "gui"

[dependencies]
"gpp.core" = { path = "../GalTranslPP" }
"gpp.version" = { path = "../GPPVersion" }

[build-dependencies]
"gpp.build" = { path = "../mcpp-build-scripts", host-module = true }
mcpp.plugins = { version = "0.15.1", features = ["deps-vcpkg", "deps-cmake", "rules-qt"], host-module = true }
"gpp.updater" = { path = "../Updater", tools = ["Updater"] }
"gpp.runtime-stage" = { path = "../mcpp-build-scripts/runtime-stage", tools = ["runtime_stage"] }

# The release directory carries 7z.dll, which bit7z loads at run time; the
# official library is part of the xim:7zip payload on Windows. The runtime
# stage reads it from this member's own declaration.
[target.windows.xlings.workspace]
# The Qt SDK, at the version this project builds with (rules-qt declares none).
"xim:qt-base" = "6.11.1.1"
"xim:7zip" = ">=26.02"

[profile.release]
opt = 3
debug = true
lto = true
strip = false
ldflags = ["-Wl,/DEBUG", "-Wl,/OPT:REF", "-Wl,/OPT:ICF", "-Wl,/INCREMENTAL:NO"]

[profile.fast-release]
opt = 0
debug = true
lto = false
strip = false
ldflags = ["-Wl,/DEBUG"]

[build]
default-profile = "release"
sources = ["**/*.cpp", "**/*.c", "!GPPGUI.cpp", "!mcpp-generated/**"]
include_dirs = [
  ".",
  "../GalTranslPP",
  "../3rdParty/pybind11/include",
  "../3rdParty/pybind11/Python/include"
]
ldflags = [
  "-L../3rdParty/pybind11/bin",
  "-lpython312",
  "-lpython3"
]

[targets.GalTranslPP_GUI]
kind = "bin"
main = "GPPGUI.cpp"
windows_subsystem = "windows"

[resources]
files = ["GPPGUI.rc"]
extra-inputs = ["GPPGUI.manifest", "Resource/images/julixian_s.ico"]
