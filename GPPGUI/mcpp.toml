[package]
namespace = "gpp"
name = "gui"

[dependencies]
"gpp.core" = { path = "../GalTranslPP" }
"gpp.version" = { path = "../GPPVersion" }
# The updater ships beside the GUI: built for the GUI's target and profile,
# none of its code linked in (mcpp 2026.9.27.1, `artifacts`).
"gpp.updater" = { path = "../Updater", artifacts = ["Updater"] }

[build-dependencies]
"gpp.build" = { path = "../mcpp-build-scripts", host-module = true }
mcpp.plugins = { workspace = true, features = ["deps-vcpkg", "deps-cmake", "rules-qt"], host-module = true }
"gpp.runtime-stage" = { path = "../mcpp-build-scripts/runtime-stage", tools = ["runtime_stage"] }

[profile.release]
opt = 3
debug = true
lto = true
strip = false
ldflags = ["-Wl,/DEBUG", "-Wl,/OPT:REF", "-Wl,/OPT:ICF", "-Wl,/INCREMENTAL:NO"]

[profile.fast-release]
opt = 0
debug = true
lto = false
strip = false
ldflags = ["-Wl,/DEBUG"]

[build]
default-profile = "release"
sources = ["**/*.cpp", "**/*.c", "!GPPGUI.cpp", "!mcpp-generated/**"]
include_dirs = [
  ".",
  "../GalTranslPP",
  "../3rdParty/pybind11/include",
  "../3rdParty/pybind11/Python/include"
]
ldflags = [
  "-L../3rdParty/pybind11/bin",
  "-lpython312",
  "-lpython3"
]

[targets.GalTranslPP_GUI]
kind = "bin"
main = "GPPGUI.cpp"
windows_subsystem = "windows"

[resources]
files = ["GPPGUI.rc"]
extra-inputs = ["GPPGUI.manifest", "Resource/images/julixian_s.ico"]
