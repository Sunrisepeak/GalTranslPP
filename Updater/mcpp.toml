[package]
namespace = "gpp"
name = "updater"

[dependencies]
"gpp.version" = { path = "../GPPVersion" }

[build-dependencies]
mcpp.plugins = { version = "0.13.1", features = ["deps-vcpkg", "rules-qt-xim"], host-module = true, tools = ["mcpp-deps"] }
"gpp.runtime-stage" = { path = "../mcpp-build-scripts/runtime-stage", tools = ["runtime_stage"] }

# The release directory carries 7z.dll, which bit7z loads at run time; the
# official library is part of the xim:7zip payload on Windows. The runtime
# stage reads it from this member's own declaration.
[target.windows.xlings.workspace]
"xim:7zip" = ">=26.02"

[profile.release]
opt = 3
debug = false
lto = true
strip = false
ldflags = ["-Wl,/OPT:REF", "-Wl,/OPT:ICF", "-Wl,/INCREMENTAL:NO"]

[profile.fast-release]
opt = 0
debug = false
lto = false
strip = false

[build]
default-profile = "release"
include_dirs = ["."]
ldflags = [
  "-luser32",
  "-loleaut32"
]

[targets.Updater]
kind = "bin"
main = "Updater.cpp"
windows_subsystem = "windows"

[resources]
files = ["Updater.rc"]
extra-inputs = ["Updater.manifest"]
